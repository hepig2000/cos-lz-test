version: 0.0
os: linux
files:
  - source: cloudformation/vpc.yaml  # 源代码中的模板文件
    destination: /tmp/vpc.yaml  # 临时存储路径

hooks:
  ApplicationStop:
    - location: shell/stop_service.sh  # 停止服务的脚本
      timeout: 300
      runas: root
  AfterInstall:
    - location: shell/deploy_to_service_catalog.sh  # 部署到 Service Catalog 的脚本
      timeout: 300
      runas: root